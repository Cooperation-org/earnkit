---
# roles/amebo — role defaults (tuning knobs; all safe to leave as-is).
#
# The SITE contract comes from group_vars (see inventory/example/group_vars/all.yml):
#   database_host, database_port, database_admin_user, database_admin_password,
#   amebo_repo, amebo_branch, amebo_db_name, amebo_db_user, amebo_db_password,
#   amebo_api_port, amebo_anthropic_api_key, amebo_s2s_token,
#   amebo_slack_bot_token, amebo_slack_app_token, amebo_abra_database_url,
#   amebo_cors_origins
# plus TWO new required site vars (the app refuses to start without them):
#   amebo_jwt_secret_key   — signs API auth tokens (JWT_SECRET_KEY)
#   amebo_encryption_key   — encrypts stored credentials at rest (ENCRYPTION_KEY)
# Generate each with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"
# This role uses exactly those names and defines nothing that shadows them.

# --- filesystem layout (cicd/update-amebo and add-team.yml assume these) ------
amebo_user: amebo
amebo_home: /opt/amebo                       # the git checkout itself
amebo_backend_dir: "{{ amebo_home }}/backend"
amebo_venv_dir: "{{ amebo_home }}/venv"      # cicd update script pins this path
amebo_env_file: "{{ amebo_backend_dir }}/.env"  # read by systemd AND python-dotenv (cwd)
# Next.js frontend (the cohort dash: /chat, /login, /dashboard/*). Built to a
# standalone bundle and run by amebo-frontend.service; nginx proxies to it.
# cicd/update-amebo rebuilds it on deploy.
amebo_frontend_dir: "{{ amebo_home }}/frontend"
amebo_frontend_port: 3000

# --- network -------------------------------------------------------------------
# localhost only: the VM's nginx proxies from port 80.
amebo_api_host: "127.0.0.1"

# --- Slack transport (only rendered when slack tokens are configured) ----------
# false = Socket Mode (needs amebo_slack_app_token); true = HTTP Events API.
amebo_use_event_subscriptions: false

# --- CORS ----------------------------------------------------------------------
# Comma-separated origins allowed credentialed CORS on the API (the cohort
# dash on the workers.vc apex; set in group_vars). Empty = line omitted from
# the env, so the app's built-in default origin list applies.
amebo_cors_origins: ""

# --- who answers somebody with no org --------------------------------------------
# Slug of the amebo instance that serves people who belong to no org yet — on a
# cohort VM, the accelerator's own instance (the same slug add-team gave it).
# A person screened into the applicant pool has no membership anywhere, so
# there is no org to resolve an instance from; this names the one to use. Empty
# = line omitted, and a session with no org gets 404 as before.
amebo_default_instance_slug: ""

# --- systemd resource ceiling ---------------------------------------------------
# sentence-transformers keeps an embedding model resident (torch) — leave headroom.
amebo_memory_max: 3G

# --- derived (do not override) ---------------------------------------------------
amebo_database_url: "postgresql://{{ amebo_db_user }}:{{ amebo_db_password | urlencode }}@{{ database_host }}:{{ database_port }}/{{ amebo_db_name }}"

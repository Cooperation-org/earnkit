# Drop this into a TOOL repo (amebo, govkit, marten, workersvc) as
# .github/workflows/deploy-to-cohort.yml — then set repo secrets:
#   COHORT_SSH_HOST, COHORT_SSH_KEY (private half of an earnkit deploy key)
# Change TOOL to the repo's tool name: amebo | govkit | marten | workersvc
name: Deploy to cohort VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via earnkit update script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.COHORT_SSH_HOST }}
          username: deploy
          key: ${{ secrets.COHORT_SSH_KEY }}
          script: sudo /opt/earnkit/bin/update-TOOL

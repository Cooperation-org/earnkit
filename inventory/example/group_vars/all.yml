---
# earnkit — all site-specific configuration. SAMPLE VALUES ONLY.
# Copy the inventory/example dir out of the repo, fill in, protect (vault the
# secrets: `ansible-vault encrypt_string ...`). Nothing here is optional unless
# marked optional.

# ---------------------------------------------------------------------------
# Shared
# ---------------------------------------------------------------------------
database_host: 10.0.0.100            # external Postgres; the VM runs NO database
database_port: 5432
# Admin credentials used ONLY to create databases/roles at provision time
# (never deployed to the VM — Ansible uses them locally then discards).
database_admin_user: postgres
database_admin_password: "VAULT-ME"

# Base domain for the cohort services. Default hostname scheme (override per
# service below if your scheme differs):
#   taiga.{{ cohort_domain }}, crm-<team>.{{ cohort_domain }}, ...
cohort_domain: workers.vc   # LOCKED 2026-07-13: member chain (invites + dashboard) lives on workers.vc

# SSH private key for the VM to clone repos from GitHub (service users + CI/CD).
# Generate: ssh-keygen -t ed25519 -f earnkit-vm -N "" -C "earnkit-vm"
# Add the .pub to GitHub (account SSH key or per-repo deploy key).
github_ssh_private_key: "VAULT-ME"

# LinkedTrust OIDC provider (the IdP is NOT on this VM).
oidc_issuer: https://live.linkedtrust.us
# One client per service, registered on the IdP by the operator:
govkit_oidc_client_id: "lt_xxxxxxxxxxxxxxxx"
govkit_oidc_client_secret: "VAULT-ME"
taiga_oidc_client_id: "lt_xxxxxxxxxxxxxxxx"
taiga_oidc_client_secret: "VAULT-ME"
odoo_oidc_client_id: "lt_xxxxxxxxxxxxxxxx"
odoo_oidc_client_secret: "VAULT-ME"
amebo_oidc_client_id: "lt_xxxxxxxxxxxxxxxx"
amebo_oidc_client_secret: "VAULT-ME"

# ---------------------------------------------------------------------------
# Ports (reverse-proxy targets; route hostnames to these from your proxy)
# ---------------------------------------------------------------------------
taiga_http_port: 8080        # nginx fan-out: front static + back API + events ws
marten_http_port: 8081       # nginx: marten static build
odoo_http_port: 8069
amebo_api_port: 8000
govkit_http_port: 8010
workersvc_http_port: 8015    # gunicorn on loopback; local nginx serves the apex on :80

# ---------------------------------------------------------------------------
# Taiga (task tracker) — native install, versions pinned
# ---------------------------------------------------------------------------
taiga_version: "6.8.1"                    # taiga-back / taiga-front-dist tag
taiga_domain: "taiga.{{ cohort_domain }}"
# IMPORTANT: The Postgres cluster is shared. Always suffix db/user names with
# your VM identifier to avoid collisions with other installs. All DB tasks use
# state: present (create-only, never drop), but reusing an existing name will
# connect your install to that database's data.
taiga_db_name: taiga_VMNAME
taiga_db_user: taiga_VMNAME
taiga_db_password: "VAULT-ME"
taiga_secret_key: "VAULT-ME"
taiga_admin_email: admin@example.org
# RabbitMQ (local, the only stateful non-Postgres dep; used by taiga events/async)
rabbitmq_taiga_user: taiga
rabbitmq_taiga_password: "VAULT-ME"
rabbitmq_taiga_vhost: taiga

# ---------------------------------------------------------------------------
# Marten (Taiga frontend) — built from source, served static
# ---------------------------------------------------------------------------
marten_repo: git@github.com:Cooperation-org/marten.git
marten_branch: main
marten_domain: "martin.{{ cohort_domain }}"

# ---------------------------------------------------------------------------
# Odoo 17 (CRM) — native source install; ONE DATABASE PER TEAM
# ---------------------------------------------------------------------------
odoo_version: "17.0"                      # git branch of odoo/odoo
odoo_db_user: odoo_VMNAME
odoo_db_password: "VAULT-ME"
odoo_admin_password: "VAULT-ME"           # master password (db management)
# Team CRM hostname scheme; %d is the hostname's first label, mapped 1:1 to the
# database name. Odoo needs one database per team, so there is no bare
# crm.<domain> — every CRM is crm-<team_slug>:
#   crm-vc.{{ cohort_domain }}          -> database crm-vc      (the vc team)
#   crm-<team_slug>.{{ cohort_domain }} -> database crm-<team_slug>
# Keep team slugs distinct on the shared postgres (the cluster hosts unrelated
# projects); the crm- prefix plus the slug is what keeps them separate.
odoo_dbfilter: "^%d$"
# Custom CRM addons installed into every team database (each addon is its own
# repo — earnkit composes, never forks). Two more addons exist on our live CRM
# but are not yet in git (crm_relationship_dashboard, quick_outreach) — add
# them here once they have repos.
odoo_custom_addons:
  - { name: crm_card_scanner,   repo: "git@github.com:Cooperation-org/crm-card-scanner.git" }
  - { name: crm_outreach_runner, repo: "git@github.com:Cooperation-org/crm-outreach-runner.git", branch: master }
# Modules initialized in each new team DB (add-team.yml):
odoo_team_init_modules: "base,crm,auth_oauth,crm_card_scanner,crm_outreach_runner"

# ---------------------------------------------------------------------------
# amebo (team agent) — from source; multitenant via its instances table
# ---------------------------------------------------------------------------
amebo_repo: git@github.com:Cooperation-org/amebo.git
amebo_branch: main
amebo_domain: "amebo.{{ cohort_domain }}"
amebo_db_name: amebo_VMNAME
amebo_db_user: amebo_VMNAME
amebo_db_password: "VAULT-ME"
amebo_anthropic_api_key: "VAULT-ME"
# amebo refuses to boot without these two:
amebo_jwt_secret_key: "VAULT-ME"     # python3 -c "import secrets; print(secrets.token_urlsafe(32))"
amebo_encryption_key: "VAULT-ME"     # same generator; Fernet key for stored credentials
# Optional integrations (empty = disabled):
amebo_slack_bot_token: ""
amebo_slack_app_token: ""
amebo_abra_database_url: ""
# Static bearer token for amebo's S2S provisioning API (/api/orgs/provision —
# amebo is the team registry, see docs/TEAM_PROVISIONING.md in the amebo repo).
# The same value goes into the amebo AND govkit envs:
amebo_s2s_token: "VAULT-ME"
# Origins allowed credentialed CORS on amebo's API — the cohort dash on the
# apex plus amebo's own host (PLAN-cohort-dash.md). Empty = amebo's built-in
# default origin list:
amebo_cors_origins: "https://{{ workersvc_domain }},https://{{ amebo_domain }}"

# Origins amebo's OIDC login may return a ?next= chain hop to — lets the dash
# sign-in cascade pass through amebo and land back on the apex (amebo
# PLAN-cohort-dash.md, SSO-once addition). Empty allows FRONTEND_URL only:
amebo_oidc_next_allowed_origins: "https://{{ workersvc_domain }}"

# ---------------------------------------------------------------------------
# GovKit (earned governance) — from source
# ---------------------------------------------------------------------------
govkit_repo: git@github.com:Cooperation-org/govkit.git
govkit_branch: main
govkit_domain: "dash.{{ cohort_domain }}"   # the invitee-facing name: dash.earnedgov.com
govkit_db_name: govkit_VMNAME
govkit_db_user: govkit_VMNAME
govkit_db_password: "VAULT-ME"
govkit_secret_key: "VAULT-ME"
# Fernet key for task-source API tokens (distinct from Django SECRET_KEY);
# needed once a team connects a Taiga source:
govkit_fernet_key: "VAULT-ME"        # python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# Shared secret for GovKit's doorway S2S API (invite resolve/committed).
# The same value goes into the govkit AND workersvc envs; empty disables the
# endpoints (every call 401s):
govkit_s2s_token: "VAULT-ME"
# Origins allowed credentialed CORS on GovKit's API — the cohort dash lives on
# the apex and mounts GovKit's embed components (PLAN-cohort-dash.md). Empty
# disables cross-origin API access:
govkit_cors_origins: "https://{{ workersvc_domain }}"

# Hostnames GovKit may bounce an absolute https ?next= to after LinkedTrust
# login — lets the dash sign-in cascade return to the apex (govkit
# PLAN-cohort-dash.md item 6). Empty keeps next= same-site only:
govkit_login_next_allowed_hosts: "{{ workersvc_domain }}"

# Front door GovKit sends members through to connect with a team: URL template
# for the per-org connect page on the apex. {org_slug} is substituted by
# govkit itself — keep it literal (single braces are not jinja):
govkit_cohort_front_door: "https://{{ workersvc_domain }}/dash/{org_slug}/connect/"

# ---------------------------------------------------------------------------
# workersvc (Workers.vc public face) — from source
# ---------------------------------------------------------------------------
workersvc_repo: git@github.com:Cooperation-org/workers.vc.git
workersvc_branch: main
workersvc_domain: "{{ cohort_domain }}"     # the apex — workers.vc itself (+ www)
workersvc_db_name: workersvc_VMNAME
workersvc_db_user: workersvc_VMNAME
workersvc_db_password: "VAULT-ME"
workersvc_secret_key: "VAULT-ME"
# GovKit org whose invites the doorway resolves:
workersvc_govkit_org_slug: workersvc
# Where "go to your dashboard" points after joining:
workersvc_dashboard_url: "https://dash.{{ cohort_domain }}"
# LinkedTrust claims backend the doorway posts signed claims to (same host as
# oidc_issuer today, but a distinct role — keep them separate vars):
lt_api: https://live.linkedtrust.us
# LinkedTrust client credentials for the doorway's claim POSTs (issuer-stamped
# approval claims) — registered on the IdP by the operator:
workersvc_lt_client_id: "lt_xxxxxxxxxxxxxxxx"
workersvc_lt_client_secret: "VAULT-ME"
# amebo links token for the dash tools row — a personal amebo JWT until amebo
# grows service auth for /api/organizations/links (PLAN-cohort-dash.md; will
# become an amebo API key). Empty omits the tools row:
workersvc_amebo_api_token: "VAULT-ME"

# ---------------------------------------------------------------------------
# Caddy API on Proxmox host (auto-provisions CRM subdomain routes + TLS)
# add-team.yml calls this to register crm-<slug>.cohort_domain on the proxy.
# ---------------------------------------------------------------------------
caddy_api_host: 10.0.0.1
caddy_api_port: 9090
caddy_api_token: "VAULT-ME"

# ---------------------------------------------------------------------------
# CI/CD — restricted deploy user the GitHub Actions workflows ssh in as
# ---------------------------------------------------------------------------
deploy_user: deploy
# Public key(s) whose PRIVATE half lives in each tool repo's GH Actions secrets:
deploy_authorized_keys: []
#  - "ssh-ed25519 AAAA... earnkit-deploy"

# Git access for cloning private repos at provision time: either make the
# repos readable by the VM's root ssh key (deploy key per repo) or use https
# URLs with a token. Operator's choice; document what you did in your private
# inventory.

---
# earnkit — provision TEAM-level resources for one cohort team.
# Usage:
#   ansible-playbook -i <inventory> playbooks/add-team.yml \
#     -e team_slug=sunrise -e team_name="Sunrise Co-op"
#
# Creates: Odoo database, Taiga private project, amebo instance row + registry
# org (amebo is the team registry), GovKit org.
# NEVER provisions individual people — that is amebo's job (see docs/DECISIONS.md #6).
- name: Add a cohort team
  hosts: cohort
  become: true
  vars:
    team_slug: ""     # required, [a-z0-9-]
    team_name: ""     # required, display name

  # The team's amebo identity prompt and tool list. Shared with
  # refresh-team.yml, which is how a team created before those existed gets
  # them; keeping one copy is what stops the two plays giving different
  # teams different agents.
  vars_files:
    - vars/amebo-team-defaults.yml

  pre_tasks:
    - name: Validate team vars
      ansible.builtin.assert:
        that:
          - team_slug is match('^[a-z0-9][a-z0-9-]{1,30}$')
          - team_name | length > 1
        fail_msg: "Pass -e team_slug=<slug> -e team_name='<Display Name>'"

  tasks:
    # ---- Odoo: one database per team --------------------------------------
    # HARD GUARD. postgresql_db state:present is create-or-reuse, and this
    # Postgres cluster is shared with unrelated projects. Silently reusing an
    # existing name would attach a new team's CRM to somebody else's data —
    # unrecoverable once Odoo writes to it. Refuse to touch a name that already
    # exists; a collision is always an operator decision, never an automatic one.
    - name: "Odoo: does database crm-{{ team_slug }} already exist?"
      community.postgresql.postgresql_query:
        login_host: "{{ database_host }}"
        login_port: "{{ database_port }}"
        login_user: "{{ database_admin_user }}"
        login_password: "{{ database_admin_password }}"
        db: postgres
        query: "SELECT 1 FROM pg_database WHERE datname = %(name)s"
        named_args:
          name: "crm-{{ team_slug }}"
      register: crm_db_probe
      no_log: true

    - name: "STOP — database crm-{{ team_slug }} already exists"
      ansible.builtin.fail:
        msg: >-
          Database crm-{{ team_slug }} already exists on {{ database_host }}.
          Refusing to provision team '{{ team_slug }}'. The cluster is shared,
          so this name may belong to another team or another project entirely,
          and pointing Odoo at it would mix or destroy that data. Choose a
          different team_slug, or drop/rename the existing database by hand
          first if you are certain it is stale.
      when: (crm_db_probe.query_result | default([]) | length) > 0

    # Mirrors Odoo's own createdb (unicode, template0, C collate).
    - name: "Odoo DB crm-{{ team_slug }}"
      community.postgresql.postgresql_db:
        login_host: "{{ database_host }}"
        port: "{{ database_port }}"
        login_user: "{{ database_admin_user }}"
        login_password: "{{ database_admin_password }}"
        maintenance_db: postgres
        name: "crm-{{ team_slug }}"
        owner: "{{ odoo_db_user }}"
        encoding: UTF-8
        lc_collate: C     # VERIFY: matches odoo/service/db.py; C.UTF-8 also fine
        template: template0
        state: present
      register: odoo_db
      no_log: true

    - name: "Odoo: initialize crm-{{ team_slug }} (crm + auth_oauth, no demo)"
      ansible.builtin.command:
        argv:
          - /opt/odoo/venv/bin/python
          - /opt/odoo/odoo/odoo-bin
          - -c
          - /etc/odoo/odoo.conf
          - -d
          - "crm-{{ team_slug }}"
          - -i
          - "{{ odoo_team_init_modules | default('base,crm,auth_oauth') }}"
          - --without-demo=all
          - --stop-after-init
          - --no-http
      become_user: odoo
      when: odoo_db.changed

    # Register the LinkedTrust OIDC provider in the team DB (idempotent).
    # Endpoints CONFIRMED against the live CRM provider row (2026-07-13):
    # stock auth_oauth uses the implicit flow — IdP client must allow it.
    # Redirect URI per team: https://crm-<slug>.{{ cohort_domain }}/auth_oauth/signin
    - name: "Odoo: LinkedTrust OIDC provider in crm-{{ team_slug }}"
      ansible.builtin.shell:
        cmd: |
          /opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin shell \
            -c /etc/odoo/odoo.conf -d crm-{{ team_slug }} --no-http <<'PY'
          Provider = env['auth.oauth.provider']
          vals = {
              'name': 'LinkedTrust',
              'client_id': '{{ odoo_oidc_client_id }}',
              'auth_endpoint': '{{ oidc_issuer }}/oauth/authorize',
              'validation_endpoint': '{{ oidc_issuer }}/oauth/userinfo',
              'data_endpoint': False,
              'scope': 'openid email trust',
              'enabled': True,
              'body': 'Log in with LinkedTrust',
          }
          existing = Provider.search([('name', '=', 'LinkedTrust')])
          existing.write(vals) if existing else Provider.create(vals)
          env.cr.commit()
          PY
      become_user: odoo
      when: odoo_db.changed

    # Brand the fresh DB: company name + frozen base url (same step as
    # playbooks/brand-team-crm.yml, which also covers pre-existing teams).
    - name: "Odoo: brand crm-{{ team_slug }} (company name, web.base.url)"
      ansible.builtin.shell:
        cmd: |
          /opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin shell \
            -c /etc/odoo/odoo.conf -d crm-{{ team_slug }} --no-http <<'PY'
          company = env.ref('base.main_company')
          company.write({'name': """{{ team_name }}"""})
          # Brand the stock sales team to the org, so new members join a
          # team named for them (sync-members-odoo adds each member to it).
          team = env.ref('sales_team.team_sales_department', raise_if_not_found=False)
          if team:
              team.write({'name': """{{ team_name }}"""})
          icp = env['ir.config_parameter'].sudo()
          icp.set_param('web.base.url', 'https://crm-{{ team_slug }}.{{ cohort_domain }}')
          icp.set_param('web.base.url.freeze', 'True')
          env.cr.commit()
          PY
      become_user: odoo
      when: odoo_db.changed

    # ---- Odoo: the account amebo logs in as, in THIS team's database -------
    # An Odoo user lives inside one database, so a per-team database means a
    # per-team user. Without it amebo holds credentials that authenticate
    # nowhere and every CRM tool answers "CRM not configured".
    - name: "Odoo: amebo service account"
      ansible.builtin.import_tasks: tasks/odoo-service-user.yml

    # Optional: hand the team's founder their admin invite in the same run.
    # Pass -e founder_name='Full Name' (and optionally founder_email=...);
    # the play output ends with the one link to send them.
    - name: "GovKit: mint founder admin invite for {{ founder_name | default('') }}"
      ansible.builtin.command:
        argv:
          - /opt/govkit/venv/bin/python
          - /opt/govkit/src/manage.py
          - mint_invite
          - "{{ team_slug }}"
          - --name
          - "{{ founder_name }}"
          - --email
          - "{{ founder_email | default('') }}"
          - --role
          - admin
          - --audience
          - founder
      args:
        chdir: /opt/govkit/src
      become_user: govkit
      register: founder_invite
      when: founder_name is defined

    - name: "Founder invite link (send this to them)"
      ansible.builtin.debug:
        msg: "{{ founder_invite.stdout_lines | last }}"
      when: founder_name is defined

    # ---- Taiga: one private project per team ------------------------------
    - name: "Taiga: private project {{ team_slug }}"
      ansible.builtin.shell: |
        /opt/taiga/venv/bin/python /opt/taiga/taiga-back/manage.py shell -c "
        from django.contrib.auth import get_user_model
        from taiga.projects.models import Project
        User = get_user_model()
        owner = User.objects.filter(is_superuser=True).order_by('id').first()
        p, created = Project.objects.get_or_create(
            slug='{{ team_slug }}',
            defaults=dict(name='{{ team_name }}', owner=owner,
                          is_private=True))
        print('created' if created else 'exists')
        "
      args:
        chdir: /opt/taiga/taiga-back
      # taiga-back's manage.py defaults to settings.common (localhost DB); the
      # real DB host lives in settings.config, which the taiga-back service
      # selects via this same env var. become_user does not inherit the unit's
      # Environment=, so set it explicitly or the shell hits 127.0.0.1:5432.
      environment:
        DJANGO_SETTINGS_MODULE: settings.config
      become_user: taiga
      register: taiga_proj
      changed_when: "'created' in taiga_proj.stdout"

    # ---- Taiga: the account amebo logs in as, on THIS team's board ---------
    - name: "Taiga: amebo service account"
      ansible.builtin.import_tasks: tasks/taiga-service-user.yml

    # ---- amebo: register the org and give the instance an identity -------
    - name: "amebo: org + instance"
      ansible.builtin.import_tasks: tasks/amebo-instance.yml

    # ---- GovKit: one org per team ------------------------------------------
    - name: "GovKit: org {{ team_slug }}"
      ansible.builtin.shell: |
        /opt/govkit/venv/bin/python /opt/govkit/src/manage.py shell -c "
        from apps.orgs.models import Org, ValuationConfig
        o, created = Org.objects.get_or_create(
            slug='{{ team_slug }}',
            defaults=dict(display_name='{{ team_name }}', unit_name='points'))
        ValuationConfig.objects.get_or_create(org=o)
        print('created' if created else 'exists')
        "
      args:
        chdir: /opt/govkit/src
      become_user: govkit
      register: govkit_org
      changed_when: "'created' in govkit_org.stdout"

    # ---- GovKit: Taiga task source (feeds the dash "Tasks to do" card) ------
    # Wires GovKit -> the team's Taiga board over Taiga's REST API, so the card
    # and task sync work with zero human token-pasting. base_url is the local
    # Taiga backend; api_token is the durable Application token (a Taiga bot
    # superuser that can read every team's board) from the private inventory.
    # The token is Fernet-encrypted at rest by the model's EncryptedTextField,
    # which needs GOVKIT_SECRET_KEY — manage.py loads it from /opt/govkit/src/.env.
    # NOTE: the card needs GovKit to send Taiga's Application auth scheme; until
    # that ships in the govkit repo it stores fine but returns 401 on fetch.
    - name: "GovKit: Taiga task source for {{ team_slug }}"
      ansible.builtin.shell: |
        /opt/govkit/venv/bin/python manage.py shell -c "
        import os
        from apps.orgs.models import Org
        from apps.tasksources.models import TaskSourceConfig, AdapterType
        org = Org.objects.get(slug=os.environ['TS_SLUG'])
        cfg, created = TaskSourceConfig.objects.get_or_create(
            org=org, adapter_type=AdapterType.TAIGA)
        cfg.base_url = os.environ['TS_BASE_URL']
        cfg.project_selector = os.environ['TS_SLUG']
        cfg.api_token = os.environ['TS_TOKEN']
        cfg.save()
        print('created' if created else 'updated')
        "
      args:
        chdir: /opt/govkit/src
      environment:
        TS_SLUG: "{{ team_slug }}"
        TS_BASE_URL: "{{ taiga_api_base_url }}"
        TS_TOKEN: "{{ taiga_api_token }}"
      become_user: govkit
      register: govkit_tasksource
      changed_when: "'created' in govkit_tasksource.stdout"
      no_log: true   # carries the Taiga token in its env

    # ---- Caddy: register CRM subdomain on the Proxmox host ------------------
    - name: "Caddy: route crm-{{ team_slug }}.{{ cohort_domain }}"
      ansible.builtin.uri:
        url: "http://{{ caddy_api_host }}:{{ caddy_api_port }}/add-crm-route"
        method: POST
        headers:
          Authorization: "Bearer {{ caddy_api_token }}"
        body_format: json
        body:
          slug: "{{ team_slug }}"
        status_code: [200, 201]
      when: caddy_api_token | default('') | length > 0
      no_log: true   # Authorization header carries the Caddy API token

---
# earnkit — provision TEAM-level resources for one cohort team.
# Usage:
#   ansible-playbook -i <inventory> playbooks/add-team.yml \
#     -e team_slug=sunrise -e team_name="Sunrise Co-op"
#
# Creates: Odoo database, Taiga private project, amebo instance row + registry
# org (amebo is the team registry), GovKit org.
# NEVER provisions individual people — that is amebo's job (see docs/DECISIONS.md #6).
- name: Add a cohort team
  hosts: cohort
  become: true
  vars:
    team_slug: ""     # required, [a-z0-9-]
    team_name: ""     # required, display name

    # What the team's amebo may do for a plain MEMBER. Nothing outside this list
    # exists as far as that instance is concerned — registering a tool in amebo's
    # code is not enough, the instance has to allow it. The row used to be
    # created with an empty list, which is why a brand-new team's amebo could
    # only fall back to the three built-in defaults (search_knowledge_base,
    # search_slack_history, lookup_contact) and could not touch the board or CRM
    # that this very playbook had just built for them.
    #
    # Admins are separate: on this VM every org runs on the VM's own shared
    # credentials, so amebo's registry gives an org admin the full suite already
    # (tools/registry.py _admin_defaults_to_everything). This list is what the
    # REST of the team gets.
    #
    # Deliberately excluded, not forgotten: crm_read_latest_email (reads a
    # person's mail), odoo_cli / http_fetch / file_skill (arbitrary
    # command/URL/file reach), slack_post (posts in the team's name). Add them
    # per-team, on purpose, in the inventory — not by default for everyone.
    # Also excluded: abra_search and the project-doc tools (list_projects,
    # read_main_md, edit_main_md), which need ABRA_DATABASE_URL and the shared
    # projects repo present on this VM. Granting a tool whose backing store is
    # absent just produces errors, so those stay off until the store is wired.
    amebo_team_allowed_tools:
      # the team's own board (Taiga project created above)
      - taiga_list
      - taiga_create_task
      - taiga_update_task
      - taiga_add_comment
      - taiga_close_task
      # the team's own CRM (Odoo database created above)
      - crm_list_contacts
      - crm_list_leads
      - crm_recent_activity
      - crm_create_contact
      - crm_log_contacted
      - crm_tag_contact
      - crm_schedule
      # asking about the world
      - web_search

    # The instance's system prompt. NULL means amebo falls back to its generic
    # default, so a new team's agent knew nothing about the team or where the
    # team's facts live. One home per fact — the same map the whatscookin
    # instance carries (see amebo docs/BOUNDARIES.md): amebo acts, it is never
    # the database.
    amebo_team_identity_prompt: |
      You are amebo for {{ team_name }}, a team in the Earned Equity Accelerator.

      Search before you ask, and answer from the team's own records rather than
      from memory. Each fact has exactly one home, and you only reference it:

        - tasks, who is doing what, deadlines -> this team's Taiga board
          (project "{{ team_slug }}"), via the taiga_* tools
        - people the team is talking to, outreach, leads -> this team's CRM,
          via the crm_* tools
        - anything about the world outside the team -> web_search

      Work is what earns equity here, and the board is the record of it: when
      someone asks what they have earned or what is left to do, the board is the
      answer, not an estimate. Never invent a task, a contact, or a number. If
      the record does not say, say that it does not say.
  pre_tasks:
    - name: Validate team vars
      ansible.builtin.assert:
        that:
          - team_slug is match('^[a-z0-9][a-z0-9-]{1,30}$')
          - team_name | length > 1
        fail_msg: "Pass -e team_slug=<slug> -e team_name='<Display Name>'"

  tasks:
    # ---- Odoo: one database per team --------------------------------------
    # HARD GUARD. postgresql_db state:present is create-or-reuse, and this
    # Postgres cluster is shared with unrelated projects. Silently reusing an
    # existing name would attach a new team's CRM to somebody else's data —
    # unrecoverable once Odoo writes to it. Refuse to touch a name that already
    # exists; a collision is always an operator decision, never an automatic one.
    - name: "Odoo: does database crm-{{ team_slug }} already exist?"
      community.postgresql.postgresql_query:
        login_host: "{{ database_host }}"
        login_port: "{{ database_port }}"
        login_user: "{{ database_admin_user }}"
        login_password: "{{ database_admin_password }}"
        db: postgres
        query: "SELECT 1 FROM pg_database WHERE datname = %(name)s"
        named_args:
          name: "crm-{{ team_slug }}"
      register: crm_db_probe
      no_log: true

    - name: "STOP — database crm-{{ team_slug }} already exists"
      ansible.builtin.fail:
        msg: >-
          Database crm-{{ team_slug }} already exists on {{ database_host }}.
          Refusing to provision team '{{ team_slug }}'. The cluster is shared,
          so this name may belong to another team or another project entirely,
          and pointing Odoo at it would mix or destroy that data. Choose a
          different team_slug, or drop/rename the existing database by hand
          first if you are certain it is stale.
      when: (crm_db_probe.query_result | default([]) | length) > 0

    # Mirrors Odoo's own createdb (unicode, template0, C collate).
    - name: "Odoo DB crm-{{ team_slug }}"
      community.postgresql.postgresql_db:
        login_host: "{{ database_host }}"
        port: "{{ database_port }}"
        login_user: "{{ database_admin_user }}"
        login_password: "{{ database_admin_password }}"
        maintenance_db: postgres
        name: "crm-{{ team_slug }}"
        owner: "{{ odoo_db_user }}"
        encoding: UTF-8
        lc_collate: C     # VERIFY: matches odoo/service/db.py; C.UTF-8 also fine
        template: template0
        state: present
      register: odoo_db
      no_log: true

    - name: "Odoo: initialize crm-{{ team_slug }} (crm + auth_oauth, no demo)"
      ansible.builtin.command:
        argv:
          - /opt/odoo/venv/bin/python
          - /opt/odoo/odoo/odoo-bin
          - -c
          - /etc/odoo/odoo.conf
          - -d
          - "crm-{{ team_slug }}"
          - -i
          - "{{ odoo_team_init_modules | default('base,crm,auth_oauth') }}"
          - --without-demo=all
          - --stop-after-init
          - --no-http
      become_user: odoo
      when: odoo_db.changed

    # Register the LinkedTrust OIDC provider in the team DB (idempotent).
    # Endpoints CONFIRMED against the live CRM provider row (2026-07-13):
    # stock auth_oauth uses the implicit flow — IdP client must allow it.
    # Redirect URI per team: https://crm-<slug>.{{ cohort_domain }}/auth_oauth/signin
    - name: "Odoo: LinkedTrust OIDC provider in crm-{{ team_slug }}"
      ansible.builtin.shell:
        cmd: |
          /opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin shell \
            -c /etc/odoo/odoo.conf -d crm-{{ team_slug }} --no-http <<'PY'
          Provider = env['auth.oauth.provider']
          vals = {
              'name': 'LinkedTrust',
              'client_id': '{{ odoo_oidc_client_id }}',
              'auth_endpoint': '{{ oidc_issuer }}/oauth/authorize',
              'validation_endpoint': '{{ oidc_issuer }}/oauth/userinfo',
              'data_endpoint': False,
              'scope': 'openid email trust',
              'enabled': True,
              'body': 'Log in with LinkedTrust',
          }
          existing = Provider.search([('name', '=', 'LinkedTrust')])
          existing.write(vals) if existing else Provider.create(vals)
          env.cr.commit()
          PY
      become_user: odoo
      when: odoo_db.changed

    # Brand the fresh DB: company name + frozen base url (same step as
    # playbooks/brand-team-crm.yml, which also covers pre-existing teams).
    - name: "Odoo: brand crm-{{ team_slug }} (company name, web.base.url)"
      ansible.builtin.shell:
        cmd: |
          /opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin shell \
            -c /etc/odoo/odoo.conf -d crm-{{ team_slug }} --no-http <<'PY'
          company = env.ref('base.main_company')
          company.write({'name': """{{ team_name }}"""})
          # Brand the stock sales team to the org, so new members join a
          # team named for them (sync-members-odoo adds each member to it).
          team = env.ref('sales_team.team_sales_department', raise_if_not_found=False)
          if team:
              team.write({'name': """{{ team_name }}"""})
          icp = env['ir.config_parameter'].sudo()
          icp.set_param('web.base.url', 'https://crm-{{ team_slug }}.{{ cohort_domain }}')
          icp.set_param('web.base.url.freeze', 'True')
          env.cr.commit()
          PY
      become_user: odoo
      when: odoo_db.changed

    # Optional: hand the team's founder their admin invite in the same run.
    # Pass -e founder_name='Full Name' (and optionally founder_email=...);
    # the play output ends with the one link to send them.
    - name: "GovKit: mint founder admin invite for {{ founder_name | default('') }}"
      ansible.builtin.command:
        argv:
          - /opt/govkit/venv/bin/python
          - /opt/govkit/src/manage.py
          - mint_invite
          - "{{ team_slug }}"
          - --name
          - "{{ founder_name }}"
          - --email
          - "{{ founder_email | default('') }}"
          - --role
          - admin
          - --audience
          - founder
      args:
        chdir: /opt/govkit/src
      become_user: govkit
      register: founder_invite
      when: founder_name is defined

    - name: "Founder invite link (send this to them)"
      ansible.builtin.debug:
        msg: "{{ founder_invite.stdout_lines | last }}"
      when: founder_name is defined

    # ---- Taiga: one private project per team ------------------------------
    - name: "Taiga: private project {{ team_slug }}"
      ansible.builtin.shell: |
        /opt/taiga/venv/bin/python /opt/taiga/taiga-back/manage.py shell -c "
        from django.contrib.auth import get_user_model
        from taiga.projects.models import Project
        User = get_user_model()
        owner = User.objects.filter(is_superuser=True).order_by('id').first()
        p, created = Project.objects.get_or_create(
            slug='{{ team_slug }}',
            defaults=dict(name='{{ team_name }}', owner=owner,
                          is_private=True))
        print('created' if created else 'exists')
        "
      args:
        chdir: /opt/taiga/taiga-back
      # taiga-back's manage.py defaults to settings.common (localhost DB); the
      # real DB host lives in settings.config, which the taiga-back service
      # selects via this same env var. become_user does not inherit the unit's
      # Environment=, so set it explicitly or the shell hits 127.0.0.1:5432.
      environment:
        DJANGO_SETTINGS_MODULE: settings.config
      become_user: taiga
      register: taiga_proj
      changed_when: "'created' in taiga_proj.stdout"

    # ---- amebo: register the org in the team registry ----------------------
    # amebo is the team registry — the operational system-of-record for orgs,
    # members, and per-tool accounts (docs/TEAM_PROVISIONING.md in the amebo
    # repo). The S2S endpoint upserts the org row; idempotent on slug.
    # MUST run before the instance row below: the instance needs the org_id
    # this returns.
    - name: "amebo: provision org {{ team_slug }} in the team registry"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ amebo_api_port }}/api/orgs/provision"
        method: POST
        headers:
          Authorization: "Bearer {{ amebo_s2s_token }}"
        body_format: json
        body:
          slug: "{{ team_slug }}"
          name: "{{ team_name }}"
          source: "add-team"
          members: []
      register: amebo_org
      # The Authorization header holds the amebo S2S token, and uri echoes its
      # own arguments back in the task result (`headers` is a free-form dict, so
      # unlike a module's declared password parameters it is NOT redacted) — so
      # without this the token went in clear text into the runner's job log and
      # the journal on every failed add-team, where anyone reading logs could
      # lift it. register still works under no_log.
      no_log: true
      # no_log hides the REASON a call failed too, and this one failing is a
      # normal operational event people need to read. So do not fail here: judge
      # the result in the next task, which sees the status and body but never the
      # headers, and can therefore say what went wrong out loud.
      failed_when: false

    - name: "STOP — amebo would not register org {{ team_slug }}"
      ansible.builtin.fail:
        msg: >-
          amebo refused to provision org '{{ team_slug }}'
          (HTTP {{ amebo_org.status | default('no response') }}).
          {{ amebo_org.json | default(amebo_org.msg) | default('') | string | truncate(400) }}
          Nothing else in the team stack can be built without the org_id it
          returns. Check amebo's own log, AMEBO_S2S_TOKEN on both sides, and
          that the LEGACY_ENV_ORG_ID pin is set (it answers 503 when it is not).
      when: amebo_org.status | default(0) != 200

    # ---- amebo: one instance row per team ---------------------------------
    # org_id is REQUIRED. amebo's dashboard endpoints (e.g. /api/organizations/
    # links, /board) select `FROM instances WHERE org_id = %s`, so an instance
    # with a NULL org_id is invisible to them and the dash renders empty rows
    # with no error. It was omitted here originally.
    #
    # Upsert, not insert-if-absent: the old form skipped the row entirely when
    # the slug existed, so a team created before this playbook set an identity
    # prompt and a tool list stayed permanently toolless and a re-run could not
    # repair it. Filling in is safe and clobbering is not, so each field is only
    # written when it is EMPTY — an instance somebody has since tuned by hand
    # keeps exactly what they set.
    - name: "amebo: instance row for {{ team_slug }}"
      community.postgresql.postgresql_query:
        login_host: "{{ database_host }}"
        login_port: "{{ database_port }}"
        login_user: "{{ amebo_db_user }}"
        login_password: "{{ amebo_db_password }}"
        db: "{{ amebo_db_name }}"
        query: >
          INSERT INTO instances (name, slug, org_id, identity_prompt, config)
          VALUES (%(name)s, %(slug)s, %(org_id)s, %(identity_prompt)s,
                  jsonb_build_object('allowed_tools', %(allowed_tools)s::jsonb))
          ON CONFLICT (slug) DO UPDATE SET
              org_id = COALESCE(instances.org_id, EXCLUDED.org_id),
              identity_prompt = COALESCE(NULLIF(instances.identity_prompt, ''),
                                         EXCLUDED.identity_prompt),
              config = CASE
                  WHEN COALESCE(jsonb_array_length(instances.config -> 'allowed_tools'), 0) = 0
                  THEN COALESCE(instances.config, '{}'::jsonb) || EXCLUDED.config
                  ELSE instances.config
              END,
              updated_at = NOW()
        named_args:
          name: "{{ team_name }}"
          slug: "{{ team_slug }}"
          org_id: "{{ amebo_org.json.org_id }}"
          identity_prompt: "{{ amebo_team_identity_prompt }}"
          allowed_tools: "{{ amebo_team_allowed_tools | to_json }}"

    # ---- GovKit: one org per team ------------------------------------------
    - name: "GovKit: org {{ team_slug }}"
      ansible.builtin.shell: |
        /opt/govkit/venv/bin/python /opt/govkit/src/manage.py shell -c "
        from apps.orgs.models import Org, ValuationConfig
        o, created = Org.objects.get_or_create(
            slug='{{ team_slug }}',
            defaults=dict(display_name='{{ team_name }}', unit_name='points'))
        ValuationConfig.objects.get_or_create(org=o)
        print('created' if created else 'exists')
        "
      args:
        chdir: /opt/govkit/src
      become_user: govkit
      register: govkit_org
      changed_when: "'created' in govkit_org.stdout"

    # ---- GovKit: Taiga task source (feeds the dash "Tasks to do" card) ------
    # Wires GovKit -> the team's Taiga board over Taiga's REST API, so the card
    # and task sync work with zero human token-pasting. base_url is the local
    # Taiga backend; api_token is the durable Application token (a Taiga bot
    # superuser that can read every team's board) from the private inventory.
    # The token is Fernet-encrypted at rest by the model's EncryptedTextField,
    # which needs GOVKIT_SECRET_KEY — manage.py loads it from /opt/govkit/src/.env.
    # NOTE: the card needs GovKit to send Taiga's Application auth scheme; until
    # that ships in the govkit repo it stores fine but returns 401 on fetch.
    - name: "GovKit: Taiga task source for {{ team_slug }}"
      ansible.builtin.shell: |
        /opt/govkit/venv/bin/python manage.py shell -c "
        import os
        from apps.orgs.models import Org
        from apps.tasksources.models import TaskSourceConfig, AdapterType
        org = Org.objects.get(slug=os.environ['TS_SLUG'])
        cfg, created = TaskSourceConfig.objects.get_or_create(
            org=org, adapter_type=AdapterType.TAIGA)
        cfg.base_url = os.environ['TS_BASE_URL']
        cfg.project_selector = os.environ['TS_SLUG']
        cfg.api_token = os.environ['TS_TOKEN']
        cfg.save()
        print('created' if created else 'updated')
        "
      args:
        chdir: /opt/govkit/src
      environment:
        TS_SLUG: "{{ team_slug }}"
        TS_BASE_URL: "{{ taiga_api_base_url }}"
        TS_TOKEN: "{{ taiga_api_token }}"
      become_user: govkit
      register: govkit_tasksource
      changed_when: "'created' in govkit_tasksource.stdout"
      no_log: true   # carries the Taiga token in its env

    # ---- Caddy: register CRM subdomain on the Proxmox host ------------------
    - name: "Caddy: route crm-{{ team_slug }}.{{ cohort_domain }}"
      ansible.builtin.uri:
        url: "http://{{ caddy_api_host }}:{{ caddy_api_port }}/add-crm-route"
        method: POST
        headers:
          Authorization: "Bearer {{ caddy_api_token }}"
        body_format: json
        body:
          slug: "{{ team_slug }}"
        status_code: [200, 201]
      when: caddy_api_token | default('') | length > 0
      no_log: true   # Authorization header carries the Caddy API token

---
# earnkit — sync every GovKit member of each team org into the team's other
# tools, so their first OIDC login lands on a ready account:
#
#   * Odoo:  an INTERNAL user in the team's crm-<slug> database, in the groups
#            {{ odoo_member_group_xmlids }} and linked to their LinkedTrust
#            identity (auth_oauth matches on oauth_uid = the OIDC sub, so the
#            pre-created user IS the one their login resolves to).
#   * Taiga: a user + a Membership in the team's project, matched STRICTLY by
#            email — the same one rule django-linkedtrust-auth's taiga_adapter
#            (LINKEDTRUST_USER_HANDLER in roles/taiga config.py.j2) applies at
#            login, so sync and first login converge on the same user. Caveat:
#            if a member's GovKit email differs from their LinkedTrust email,
#            first login creates a duplicate Taiga user — keep them aligned.
#
# Source of truth for WHO: GovKit memberships (orgs_membership -> accounts_user).
# Per-system requirements differ: Taiga needs only the member's email; Odoo
# also needs the LinkedTrust sub (accounts_user.auth_provider_id where
# auth_provider='linkedtrust') because auth_oauth matches on oauth_uid.
# Members without a sub (never signed into GovKit via LinkedTrust) are
# reported and skipped FOR THE CRM ONLY — Taiga still syncs them; re-run
# after they log in to complete the CRM side.
#
# Source of truth for WHICH TEAMS: the crm-<slug> databases owned by
# {{ odoo_db_user }} (discovered at runtime, never a hardcoded list),
# intersected with GovKit's org slugs. Non-team databases are never touched.
#
# Idempotent: re-running changes nothing for already-provisioned members.
# It only ever creates or links; it never removes a group, role, or
# membership, never deactivates anyone, and never relinks a user who already
# carries a DIFFERENT LinkedTrust sub (those are reported for the operator).
#
# When to run (operator, one command): after add-team.yml, and again whenever
# team membership changes. Per DECISIONS.md #6 member orchestration ultimately
# belongs to amebo; this playbook is the operator-run reconcile until amebo's
# member provisioning covers the CRM and Taiga.
#
# Usage:
#   ansible-playbook -i <inventory> playbooks/sync-team-members.yml
- name: Sync GovKit org members into team CRM databases and Taiga projects
  hosts: cohort
  become: true
  tasks:
    # ---- GovKit: the member list (source of truth) -------------------------
    - name: "GovKit: read org memberships"
      community.postgresql.postgresql_query:
        login_host: "{{ database_host }}"
        login_port: "{{ database_port }}"
        login_user: "{{ govkit_db_user }}"
        login_password: "{{ govkit_db_password }}"
        db: "{{ govkit_db_name }}"
        query: >
          SELECT o.slug AS org_slug, u.email, u.display_name,
                 u.auth_provider, u.auth_provider_id
          FROM orgs_membership m
          JOIN orgs_org o ON o.id = m.org_id
          JOIN accounts_user u ON u.id = m.user_id
          WHERE u.is_active
          ORDER BY o.slug, u.email
      register: govkit_members
      changed_when: false

    # ---- Odoo: which teams exist (same discovery as upgrade-addons) --------
    - name: "Odoo: discover team CRM databases (crm-<slug> owned by {{ odoo_db_user }})"
      community.postgresql.postgresql_query:
        login_host: "{{ database_host }}"
        login_port: "{{ database_port }}"
        login_user: "{{ odoo_db_user }}"
        login_password: "{{ odoo_db_password }}"
        db: postgres
        query: >
          SELECT d.datname FROM pg_database d
          JOIN pg_roles r ON r.oid = d.datdba
          WHERE r.rolname = %(owner)s
            AND d.datname ~ '^crm-[a-z0-9-]+$'
          ORDER BY d.datname
        named_args:
          owner: "{{ odoo_db_user }}"
      register: crm_dbs
      changed_when: false

    - name: Compute team slugs and provisionable members
      ansible.builtin.set_fact:
        # Teams = GovKit orgs that have a CRM database. Orgs without one are
        # reported below, never guessed at.
        sync_team_slugs: >-
          {{ crm_dbs.query_result | map(attribute='datname')
             | map('regex_replace', '^crm-', '') | list
             | intersect(govkit_members.query_result
                         | map(attribute='org_slug') | unique | list)
             | sort }}
        # CRM-provisionable = the member has a LinkedTrust subject. Without it
        # there is nothing for auth_oauth's oauth_uid match to link — no email
        # guessing in Odoo. (Taiga needs no sub: its adapter matches by email.)
        sync_linked: >-
          {{ govkit_members.query_result
             | selectattr('auth_provider', 'equalto', 'linkedtrust')
             | selectattr('auth_provider_id') | list }}

    # Optional narrowing for a targeted/on-accept run: `-e sync_only_org=<slug>`
    # limits the Odoo/Taiga provisioning loops below to ONE team (what the runner's
    # run-sync-members passes). Unset -> provision every team (the scheduled timer /
    # operator reconcile). The reports above always reflect all teams.
    - name: Narrow provisioning to sync_only_org when set
      ansible.builtin.set_fact:
        sync_run_slugs: >-
          {{ sync_team_slugs | select('equalto', sync_only_org) | list
             if (sync_only_org | default('')) | length > 0
             else sync_team_slugs }}

    - name: "Report: GovKit orgs without a team CRM database (skipped)"
      ansible.builtin.debug:
        msg: >-
          No crm-<slug> database for GovKit org(s)
          {{ orphan_orgs | join(', ') }} — run add-team.yml for real teams;
          nothing synced for them.
      vars:
        orphan_orgs: >-
          {{ govkit_members.query_result | map(attribute='org_slug')
             | unique | list | difference(sync_team_slugs) }}
      when: orphan_orgs | length > 0

    - name: "Report: members without a LinkedTrust identity yet (CRM skipped)"
      ansible.builtin.debug:
        msg: >-
          No LinkedTrust subject in GovKit for
          {{ unlinked | map(attribute='email') | join(', ') }} — they have not
          signed into GovKit with LinkedTrust yet, so no CRM user can be
          linked for them (Taiga is still synced by email). Re-run after
          they log in.
      vars:
        unlinked: >-
          {{ govkit_members.query_result
             | selectattr('org_slug', 'in', sync_team_slugs)
             | rejectattr('auth_provider_id') | list
             + govkit_members.query_result
             | selectattr('org_slug', 'in', sync_team_slugs)
             | selectattr('auth_provider_id')
             | rejectattr('auth_provider', 'equalto', 'linkedtrust') | list }}
      when: unlinked | length > 0

    # ---- Odoo: internal user per member, linked to the LinkedTrust sub -----
    # Same odoo-bin shell invocation as add-team.yml's provider task; the
    # script is templated onto stdin so member data never hits a shell line.
    - name: "Odoo: sync members into crm-<slug>"
      ansible.builtin.command:
        argv:
          - /opt/odoo/venv/bin/python
          - /opt/odoo/odoo/odoo-bin
          - shell
          - -c
          - /etc/odoo/odoo.conf
          - -d
          - "crm-{{ item }}"
          - --no-http
        stdin: "{{ lookup('template', 'sync-members-odoo.py.j2') }}"
      vars:
        sync_org_slug: "{{ item }}"
        sync_members: "{{ sync_linked | selectattr('org_slug', 'equalto', item) | list }}"
      loop: "{{ sync_run_slugs }}"
      become_user: odoo
      register: odoo_sync
      changed_when: "'changed:' in odoo_sync.stdout"
      # Do NOT fail the task here. Failing it ends the play, and the Taiga sync
      # below never runs — so ONE team's broken or half-migrated CRM database
      # blocked Taiga membership for EVERY team. The two systems are
      # independent: a member needs only an email for Taiga, and Odoo's failure
      # tells us nothing about whether Taiga can be synced. Per-team results are
      # judged in the final task, which fails the run after BOTH systems have
      # had their turn, so nothing is swept under the rug — the job still exits
      # non-zero and the operator sees exactly which team broke where.
      failed_when: false

    # ---- Taiga: user (email-matched) + project membership ------------------
    # Same manage.py shell pattern as add-team.yml's project task (piped
    # stdin instead of -c so the member data never needs shell quoting).
    # ALL active members sync here — the taiga adapter needs an email, not a
    # LinkedTrust sub.
    - name: "Taiga: sync members into project <slug>"
      ansible.builtin.command:
        argv:
          - /opt/taiga/venv/bin/python
          - /opt/taiga/taiga-back/manage.py
          - shell
        stdin: "{{ lookup('template', 'sync-members-taiga.py.j2') }}"
      vars:
        sync_org_slug: "{{ item }}"
        sync_members: "{{ govkit_members.query_result | selectattr('org_slug', 'equalto', item) | list }}"
      loop: "{{ sync_run_slugs }}"
      # taiga-back's manage.py defaults to settings.common (localhost DB); the
      # real DB host lives in settings.config, which the taiga-back service runs
      # under. Without this the shell connects to 127.0.0.1:5432 and fails.
      # (Same env add-team.yml's Taiga task sets.)
      environment:
        DJANGO_SETTINGS_MODULE: settings.config
      become_user: taiga
      register: taiga_sync
      changed_when: "'changed:' in taiga_sync.stdout"
      # Same reasoning as the Odoo task above: judged at the end, not here, so
      # one team's failure cannot decide the fate of the others.
      failed_when: false

    - name: "Summary: per-team sync results"
      ansible.builtin.debug:
        msg: |
          {% for r in odoo_sync.results %}crm-{{ r.item }}: {{ r.stdout_lines | default([]) | select('match', '^(changed|skip|SYNC-RESULT)') | join('; ') }}
          {% endfor %}
          {% for r in taiga_sync.results %}taiga {{ r.item }}: {{ r.stdout_lines | default([]) | select('match', '^(changed|skip|SYNC-RESULT)') | join('; ') }}
          {% endfor %}

    # ---- Now judge both systems, per team ---------------------------------
    # The success contract is unchanged — rc 0 AND the script's own
    # 'SYNC-RESULT ok' marker. Only WHEN it is applied moved: after both systems
    # have run, so one team's failure cannot cost every other team its Taiga
    # membership. Each failure is named (team + system) and the run still exits
    # non-zero, so the runner's job state and the timer stay honest.
    # A team+system is bad when the command failed or its script never printed
    # the 'SYNC-RESULT ok' marker. Built as a report block (Jinja has no list
    # comprehensions); empty means everything succeeded.
    - name: Collect per-team sync failures
      ansible.builtin.set_fact:
        sync_failures: |-
          {% for r in odoo_sync.results | default([]) %}
          {% if r.rc | default(1) != 0 or 'SYNC-RESULT ok' not in (r.stdout | default('')) %}
          odoo  crm-{{ r.item }}: rc={{ r.rc | default('n/a') }} — {{ (r.stdout_lines | default(['(no output)']))[-2:] | join(' / ') }}
          {% endif %}
          {% endfor %}
          {% for r in taiga_sync.results | default([]) %}
          {% if r.rc | default(1) != 0 or 'SYNC-RESULT ok' not in (r.stdout | default('')) %}
          taiga {{ r.item }}: rc={{ r.rc | default('n/a') }} — {{ (r.stdout_lines | default(['(no output)']))[-2:] | join(' / ') }}
          {% endif %}
          {% endfor %}

    - name: "STOP — member sync failed for one or more teams"
      ansible.builtin.fail:
        msg: |
          Member sync did not complete cleanly. Both systems were attempted for
          every team, so the failures below did not block anybody else:
          {{ sync_failures }}
      when: sync_failures | trim | length > 0

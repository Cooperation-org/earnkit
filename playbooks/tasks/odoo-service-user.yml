---
# earnkit — the Odoo user amebo logs in as, inside ONE team database.
#
# Why a task file and not a role: an Odoo user exists inside a single database,
# so amebo needs one in every crm-<slug>. add-team.yml creates it for a new
# team; refresh-team.yml creates it for the teams that predate this. Both
# import this file so the account is defined once.
#
# Requires: team_slug, plus amebo_odoo_service_login / _password / _name from
# the inventory. Idempotent — safe to re-run; the password is rewritten each
# time so the database and amebo's environment cannot drift apart.
#
# Rights: an internal user (base.group_user) with the all-leads salesman group
# and contact-manager, i.e. the CRM reach the seeded tool list assumes and
# nothing more. NOT an administrator: amebo has no business changing Odoo
# settings, installing modules, or managing that database's users.

- name: "Odoo: amebo service user in crm-{{ team_slug }}"
  ansible.builtin.shell:
    cmd: |
      /opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin shell \
        -c /etc/odoo/odoo.conf -d crm-{{ team_slug }} --no-http <<'PY'
      import os
      login = os.environ['SVC_LOGIN']
      groups = [
          'base.group_user',                        # internal user (not portal)
          'sales_team.group_sale_salesman_all_leads',
          'base.group_partner_manager',             # create/edit contacts
      ]
      gids = []
      for xmlid in groups:
          grp = env.ref(xmlid, raise_if_not_found=False)
          if grp:
              gids.append(grp.id)
      vals = {
          'name': os.environ['SVC_NAME'],
          'login': login,
          'password': os.environ['SVC_PASSWORD'],
          'groups_id': [(6, 0, gids)],
      }
      # active_test=False: a user somebody archived must be found and reused,
      # not duplicated (login is unique, so a second create would just fail).
      user = env['res.users'].with_context(active_test=False).search(
          [('login', '=', login)], limit=1)
      if user:
          vals['active'] = True
          user.write(vals)
          print('updated')
      else:
          env['res.users'].create(vals)
          print('created')
      env.cr.commit()
      PY
  environment:
    SVC_LOGIN: "{{ amebo_odoo_service_login }}"
    SVC_PASSWORD: "{{ amebo_odoo_service_password }}"
    SVC_NAME: "{{ amebo_odoo_service_name | default('amebo (agent)') }}"
  become_user: odoo
  register: amebo_odoo_user
  changed_when: "'created' in amebo_odoo_user.stdout"
  no_log: true   # carries the service password in its env
  # no_log censors the failure message too, and this failing is something a
  # person has to be able to read. Judge it in the next task, which quotes only
  # rc and stderr — the password is in the environment, never in either.
  failed_when: false

- name: "STOP — could not create amebo's Odoo user in crm-{{ team_slug }}"
  ansible.builtin.fail:
    msg: >-
      odoo-bin shell exited {{ amebo_odoo_user.rc | default('?') }} for
      crm-{{ team_slug }}. amebo's CRM tools will answer "CRM not configured"
      for this team until it succeeds.
      {{ amebo_odoo_user.stderr | default('') | truncate(600) }}
  when: (amebo_odoo_user.rc | default(1)) != 0
